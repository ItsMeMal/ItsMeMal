<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Sedang dikerjakan: SoundWave" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#171034"/></linearGradient>
<linearGradient id="lab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<radialGradient id="shine" cx="0.3" cy="0.25" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<style>
.disc{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fill{transform-box:fill-box;transform-origin:left center;animation:prog 14s linear infinite}
@keyframes prog{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.q{fill:url(#bar);transform-box:fill-box;transform-origin:center bottom;animation-name:eq;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-direction:alternate}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.k{font-family:'Courier New',Consolas,monospace;font-size:13px;letter-spacing:3px;fill:#06b6d4}
.t{font-family:'Segoe UI',Roboto,Arial,sans-serif;font-weight:800;font-size:44px;fill:#fff}
.d{font-family:'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;fill:#9ca3af}
.s{font-family:'Courier New',Consolas,monospace;font-size:14px;fill:#c4b5fd}
</style>
<rect x="1" y="1" width="998" height="208" rx="20" fill="url(#bg)" stroke="#2a2250" stroke-width="2"/>
<ellipse cx="130" cy="105" rx="122" ry="92" fill="#8b5cf6" opacity=".10"/>
<g class="disc">
<circle cx="130" cy="105" r="78" fill="#0a0a0f"/>
<circle cx="130" cy="105" r="68" fill="none" stroke="#1d1d2b" stroke-width="2"/>
<circle cx="130" cy="105" r="58" fill="none" stroke="#1d1d2b" stroke-width="2"/>
<circle cx="130" cy="105" r="48" fill="none" stroke="#1d1d2b" stroke-width="2"/>
<circle cx="130" cy="105" r="38" fill="none" stroke="#1d1d2b" stroke-width="2"/>
<circle cx="130" cy="105" r="28" fill="url(#lab)"/>
<circle cx="130" cy="86" r="4" fill="#fff" opacity=".85"/>
<circle cx="130" cy="105" r="5" fill="#0a0a0f"/>
<circle cx="130" cy="105" r="78" fill="url(#shine)"/>
</g>
<text class="k" x="260" y="62">SEDANG DIKERJAKAN</text>
<text class="t" x="258" y="108">Ai Voice</text>
<text class="d" x="260" y="136">Ai Voice Assistant.</text>
<text class="s" x="260" y="160">Pyhton</text>
<rect x="260" y="178" width="560" height="6" rx="3" fill="#252540"/>
<rect class="fill" x="260" y="178" width="560" height="6" rx="3" fill="url(#bar)"/>
<rect class="q" x="880" y="70" width="8" height="70" rx="4" style="animation-duration:0.7s;animation-delay:-0.0s"/><rect class="q" x="894" y="70" width="8" height="70" rx="4" style="animation-duration:0.83s;animation-delay:-0.2s"/><rect class="q" x="908" y="70" width="8" height="70" rx="4" style="animation-duration:0.96s;animation-delay:-0.4s"/><rect class="q" x="922" y="70" width="8" height="70" rx="4" style="animation-duration:1.09s;animation-delay:-0.6s"/><rect class="q" x="936" y="70" width="8" height="70" rx="4" style="animation-duration:1.22s;animation-delay:-0.8s"/><rect class="q" x="950" y="70" width="8" height="70" rx="4" style="animation-duration:1.35s;animation-delay:-1.0s"/>
</svg>
